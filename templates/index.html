<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride Sharing Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-name">Ride Sharing Simulation</div>
    </div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>Simulation ready</span>
    </div>
  </div>
</header>

<main>

  <section class="control-strip">
    <div class="control-fields">
      <div class="control">
        <label for="numDrivers">Drivers</label>
        <input type="range" id="numDrivers" min="3" max="50" value="25">
        <output id="numDriversVal">25</output>
      </div>
      <div class="control">
        <label for="demandMultiplier">Demand</label>
        <input type="range" id="demandMultiplier" min="0.5" max="2.0" step="0.1" value="1.0">
        <output id="demandVal">1.0×</output>
      </div>
      <div class="control">
        <label for="seed">Seed</label>
        <input type="number" id="seed" value="42">
      </div>
    </div>

    <div class="control-actions">
      <button id="runSimBtn" class="btn btn-primary">Run simulation</button>
      <button id="runScenariosBtn" class="btn btn-ghost">Compare scenarios</button>
      <button id="downloadBtn" class="btn btn-ghost" disabled>Export CSV</button>
    </div>
  </section>

  <section id="tickerSection" class="ticker" style="display:none;">
    <div class="ticker-item">
      <span class="ticker-value" id="kpiCompletion">—</span>
      <span class="ticker-label">Completed</span>
    </div>
    <div class="ticker-div"></div>
    <div class="ticker-item">
      <span class="ticker-value" id="kpiNoDriver">—</span>
      <span class="ticker-label">Unserved</span>
    </div>
    <div class="ticker-div"></div>
    <div class="ticker-item">
      <span class="ticker-value" id="kpiUtilization">—</span>
      <span class="ticker-label">Fleet utilization</span>
    </div>
    <div class="ticker-div"></div>
    <div class="ticker-item">
      <span class="ticker-value" id="kpiWait">—</span>
      <span class="ticker-label">Avg wait</span>
    </div>
  </section>

  <section id="chartsSection" class="chart-grid" style="display:none;">
    <div class="panel">
      <h2>Outcome breakdown</h2>
      <canvas id="outcomeChart"></canvas>
    </div>
    <div class="panel">
      <h2>Requests by hour</h2>
      <canvas id="hourlyChart"></canvas>
    </div>
  </section>

  <section id="scenarioSection" class="panel" style="display:none;">
    <h2>Scenario comparison</h2>
    <div class="table-wrap">
      <table id="scenarioTable">
        <thead>
          <tr>
            <th>Scenario</th><th>Completed</th><th>Unserved</th>
            <th>Utilization</th><th>Avg wait</th>
          </tr>
        </thead>
        <tbody id="scenarioTableBody"></tbody>
      </table>
    </div>
    <canvas id="scenarioChart"></canvas>
  </section>

  <section id="tableSection" class="panel" style="display:none;">
    <h2>Ride log <span class="panel-note">sample of 50</span></h2>
    <div class="table-wrap">
      <table id="ridesTable">
        <thead><tr id="ridesTableHead"></tr></thead>
        <tbody id="ridesTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div class="spinner"></div>
  <p>Running simulation…</p>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
